version: "3.9"

services:
  db:
    image: postgres:16
    container_name: lab-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lab-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: